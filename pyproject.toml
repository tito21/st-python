[project]
name = "st"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.10.5",
    "pycairo>=1.28.0",
    "scikit-image>=0.25.2",
    "tqdm>=4.67.1",
    "numpy>=2.0.0",
]

[project.scripts]
main = "scripts.main:main"

[build-system]
requires = ["cython", "scikit-build-core>=0.11", "cython-cmake", "numpy>=2.0.0"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
wheel.packages = ["src/st"]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"

[tool.scikit-build.cmake.define]
ANNOTATE = {env="ANNOTATE", default=false}
PROFILE = {env="PROFILE", default=false}

[tool.uv]
package = true


[dependency-groups]
dev = [
    "snakeviz>=2.2.2",
]
